//  VIEWMODEL.CFG · РАСПОЛОЖЕНИЕ ОРУЖИЯ И РУК (СЕТАП SH1RO)
//  Источник: Конфиг sh1ro (autoexec.cfg, строки 314–318)
// ══════════════════════════════════════════════════════════════════════════════

cl_prefer_lefthanded        false    // Ведущая рука по умолчанию: false = правая, true = левая
viewmodel_fov               68       // Угол обзора рук (68 = максимум, оружие дальше от глаз)
viewmodel_offset_x          2.5      // Смещение оружия по горизонтали (2.5 = максимально прижато к правому краю)
viewmodel_offset_y          0        // Смещение оружия по глубине (0 = оригинальная дистанция sh1ro)
viewmodel_offset_z          -1.5     // Смещение оружия по высоте (-1.5 = оружие опущено вниз для максимального обзора)
viewmodel_presetpos         1        // Режим пресета sh1ro