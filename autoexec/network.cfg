// ══════════════════════════════════════════════════════════════════════════════
//  NETWORK.CFG · СЕТЕВЫЕ НАСТРОЙКИ CS2 (PINPAL RU)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ПРОПУСКНАЯ СПОСОБНОСТЬ И МАРШРУТИЗАЦИЯ ───────────────────────────────
rate                                        "100000" // Максимальный битрейт пакетов CS2 (стабильный стандарт)
mm_dedicated_search_maxping                 50       // Ограничение максимального пинга при поиске матчей (мс)
cl_timeout                                  30       // Таймаут в секундах до отключения при разрыве соединения
net_client_steamdatagram_enable_override    -1       // Маршрутизация через SDR (-1: SDR по умолчанию, 0: авто, 1: прямое UDP)

// ─── 2 · БУФЕРИЗАЦИЯ И СУБТИКИ (INTERPOLATION) ────────────────────────────────
cl_net_buffer_ticks                         0        // Буферизация сетевых тиков (0 = минимальная задержка ввода, 1 = при потерях пакетов)
cq_buffer_bloat_msecs_max                   64       // Максимальный буфер команд до сброса (дефолт 64 мс)

// ─── 3 · ПРОГНОЗИРОВАНИЕ УРОНА (ОТКЛЮЧЕНО ПО ТРЕБОВАНИЮ) ──────────────────────
// Отключено: только 100% подтверждённые сервером попадания и смерти (без ложных хитов)
cl_predict_body_shot_fx                     false    // Прогнозирование попаданий в тело (false = выкл)
cl_predict_head_shot_fx                     false    // Прогнозирование попаданий в голову (false = выкл)
cl_predict_kill_ragdolls                    false    // Прогнозирование убийств для моделей (false = выкл)

