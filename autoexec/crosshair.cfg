// ══════════════════════════════════════════════════════════════════════════════
//  CROSSHAIR.CFG · КРАСНЫЙ СТАТИЧЕСКИЙ КРЕСТ С ТОЧКОЙ (ТОЛЩИНА 2, ДЛИНА 2, ЗАЗОР 0)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ПАРАМЕТРЫ ПРИЦЕЛА (СТРОГО 2 И 2, СТИЛЬ STATIC CROSS) ────────────────
crosshair                       1        // Принудительно включить прицел
cl_crosshairstyle               4        // Style: Static Cross (стиль 4, не 3)
cl_crosshairdot                 1        // Точка в центре: ДА (1)
cl_crosshairsize                2        // Длина: 2
cl_crosshairthickness           2        // Толщина: 2
cl_crosshair_gap                0        // Зазор: 0
cl_crosshair_drawoutline        false    // Обводка: NO OUTLINE (0)
cl_crosshair_t                  false    // Т-образный: НЕТ (0)
cl_crosshair_recoil             0        // Прицел зафиксирован (НЕ следует за отдачей)

// ─── 2 · ЦВЕТ И ПРОЗРАЧНОСТЬ ──────────────────────────────────────────────────
cl_crosshairalpha               255      // Полная непрозрачность (255)
cl_crosshaircolor_r             255      // Красный канал (чистый красный)
cl_crosshaircolor_g             0        // Зеленый канал
cl_crosshaircolor_b             0        // Синий канал

// Снайперские прицелы
cl_crosshair_sniper_width       1        // Тонкие риски в зуме AWP (1 = тонкий, 0 = невидимый/стандарт)
cl_sniper_show_inaccuracy       0        // Убрать размытие/новый прицел с AWP (Новая команда CS2 2026 года)
cl_ironsight_usecrosshaircolor  true     // Точка в прицеле коллиматора совпадает с основным цветом
cl_ironsight_dot_scale          1        // Масштаб точки в зуме AUG и SG 553 (1 = стандартный размер)
cl_show_observer_crosshair      2        // Показывать прицелы наблюдаемых игроков (2 = всех игроков)
cl_observed_bot_crosshair       0        // ВСЕГДА показывать СВОЙ прицел при наблюдении за ботами (0 = свой прицел)

// ─── 3 · ПРИЦЕЛЫ ДЛЯ ГРАНАТ (ПОЛНОСТЬЮ ОТКЛЮЧЕНЫ) ─────────────────────────────
cl_grenadecrosshair_keepusercrosshair    false
cl_grenadecrosshair_smoke                false
cl_grenadecrosshair_flash                false
cl_grenadecrosshair_fire                 false
cl_grenadecrosshair_explosive            false
cl_grenadecrosshair_decoy                false


