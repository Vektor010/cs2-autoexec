// ══════════════════════════════════════════════════════════════════════════════
//  VIDEO.CFG · ГРАФИКА, FPS И ОПТИМИЗАЦИЯ CS2
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ОГРАНИЧЕНИЕ КАДРОВ (FPS) ─────────────────────────────────────────────
fps_max                                     0        // Максимальный FPS в игре (0 = без ограничений для минимального инпутлага)
fps_max_ui                                  240      // Максимальный FPS в меню (120 FPS снижает нагрев GPU и шум кулеров)
r_fullscreen_gamma                          2.1      // Яркость / гамма в полноэкранном режиме

// ─── 2 · ВИДИМОСТЬ МОДЕЛЕЙ И ТРАССЕРЫ ─────────────────────────────────────────
r_player_visibility_mode                    1        // Контрастная подсветка силуэтов игроков на фоне карты (1 = вкл)
r_drawtracers                               1        // Отрисовка трассеров пуль других игроков (1 = вкл)
r_drawtracers_firstperson                   1        // Отрисовка трассеров своих выстрелов от первого лица (1 = вкл)


// ─── 3 · ОПТИМИЗАЦИЯ И ЗАДЕРЖКА ВВОДА ─────────────────────────────────────────
cl_ragdoll_workaround_threshold             0        // Упрощённое создание физики тел ragdoll для стабильного FPS
engine_low_latency_sleep_after_client_tick  true     // Устранение неравномерного времени кадра при синхронизации тика
engine_no_focus_sleep                       8        // Время сна (мс) при сворачивании (8 мс = ~120 FPS в фоне; 0 = без ограничений)
