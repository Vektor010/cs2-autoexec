// ══════════════════════════════════════════════════════════════════════════════
//  KEYBINDS.CFG · РАСКЛАДКА УПРАВЛЕНИЯ CS2 (PINPAL RU)
//  С инверсией Shift/Ctrl, зумом радара на MOUSE4, мутом на MOUSE5, звуком на =/-
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · МЫШЬ И ОСНОВНАЯ СТРЕЛЬБА ─────────────────────────────────────────────
bind "MOUSE_X"          "yaw"                 // Ось X мыши (поворот вправо/влево)
bind "MOUSE_Y"          "pitch"               // Ось Y мыши (поворот вверх/вниз)
bind "MOUSE1"           "+attack"             // Левая кнопка: стрельба
bind "MOUSE2"           "+attack2"            // Правая кнопка: прицел / глушитель / смена режима
bind "MOUSE3"           "player_ping"         // Колёсико (клик): метка (пинг) на карте

// ─── 2 · ПЕРЕДВИЖЕНИЕ (SHIFT И CTRL ПОМЕНЯНЫ МЕСТАМИ) ─────────────────────────
bind "scancode26"       "+forward"            // W: шаг вперёд
bind "scancode22"       "+back"               // S: шаг назад
bind "scancode4"        "+left"               // A: стрейф влево
bind "scancode7"        "+right"              // D: стрейф вправо

// ИНВЕРСИЯ КЛАВИШ SHIFT И CTRL ПО ЗАПРОСУ ПОЛЬЗОВАТЕЛЯ:
bind "scancode225"      "+duck"               // Left Shift: ПРИСЕСТЬ (Crouch)
bind "scancode224"      "+sprint"             // Left Ctrl:  ТИХИЙ ШАГ (Slow Walk)

// Прыжки (пробел и колесико вниз для баннихопа)
bind "scancode44"       "+jump"               // Пробел: прыжок
bind "MWHEELDOWN"       "+jump"               // Колесо вниз: прыжок (Bhop)
bind "MWHEELUP"         "invprev"             // Колесо вверх: предыдущее оружие

// ─── 3 · ОРУЖИЕ, СВИТЧ И СМЕНА РУКИ ───────────────────────────────────────────
bind "scancode30"       "slot1"               // 1: основное оружие
bind "scancode31"       "slot2"               // 2: пистолет
bind "scancode32"       "slot3"               // 3: нож
bind "scancode34"       "slot5"               // 5: взрывчатка C4 (бомба)
bind "scancode13"       "+bomb-drop"          // J: быстрый сброс C4 без доставания в руки (QoL)
// CapsLock освобождён
bind "scancode60"       "autobuy"             // F3: автопокупка
bind "scancode61"       "rebuy"               // F4: повторная закупка прошлого раунда

bind "scancode20"       "lastinv"             // Q: предыдущее оружие (lastinv)
bind "scancode10"       "drop"                // G: выбросить оружие
bind "scancode5"        "buymenu"             // B: меню покупки
bind "scancode8"        "+use"                // E: подобрать / обезвредить / использовать
bind "scancode21"       "+reload"             // R: перезарядка
bind "scancode9"        "+lookatweapon"       // F: осмотр оружия
bind "scancode11"       "switchhands"         // H: смена ведущей руки (левая / правая)

// ─── 4 · ГРАНАТЫ И ЛЕГАЛЬНЫЙ JUMPTHROW SH1RO ──────────────────────────────────
bind "scancode33"       "slot4"               // 4: перебор всех гранат
bind "scancode29"       "slot8"               // Z: дымовая граната (Smoke)
bind "scancode27"       "slot12"              // X: мед-шприц (Healthshot)
bind "x"                "slot12"              // X: мед-шприц (Healthshot)
bind "CAPSLOCK"         "<unbound>"           // CapsLock освобождён
bind "scancode6"        "-attack"             // C: сброс атаки под большой палец (Jumpthrow: Пробел + C)
bind "k"                "-attack"             // K: альтернативный сброс атаки sh1ro
bind "scancode25"       "slot6"               // V: осколочная граната (HE Grenade)
bind "6"                "useMolly"            // 6: зажигательная / молотов (покупка/экипировка)
bind "scancode35"       "useDecoy"            // 7: ложная граната (Decoy)

// ─── 5 · БОКОВЫЕ КНОПКИ МЫШИ (ЗУМ РАДАРА И МУТ ВОЙСА) ─────────────────────────
bind "MOUSE4"           "toggle cl_radar_scale 0.70 0.35" // Боковая вперёд: зум радара (0.35 широко ↔ 0.70 ближе)
bind "MOUSE5"           "voiceToggle"                     // Боковая назад: вкл/выкл голосового чата (со статусом)

// ─── 6 · РЕГУЛИРОВКА ГРОМКОСТИ (ЛИЧНЫЙ СКРИПТ) ────────────────────────────────
bind "scancode46"       "volumeUp"            // =: громче на 5%
bind "scancode45"       "volumeDown"          // -: тише на 5%
bind "kp_plus"          "volumeUp"            // Numpad +: громче
bind "kp_minus"         "volumeDown"          // Numpad -: тише
bind "kp_0"             "mute_toggle"         // Numpad 0: вкл/выкл звук игры (Mute/Unmute)
bind "kp_ins"           "mute_toggle"         // Numpad 0 при выкл NumLock
bind "scancode98"       "mute_toggle"         // Numpad 0 scancode
bind "kp_1"             "clear"               // Numpad 1: очистить консоль (clear)
bind "kp_end"           "clear"               // Numpad 1 при выкл NumLock
bind "scancode89"       "clear"               // Numpad 1 scancode

// ─── 7 · ТАБЛИЦА СЧЁТА, ИНТЕРФЕЙС И ТЕЛЕМЕТРИЯ ────────────────────────────────
bind "scancode43"       "+scorenet"           // TAB: таблица счёта (радар остаётся круглым)
bind "scancode47"       "debug-hud"           // [ (Х): чистый переключатель мониторинга FPS и сети
bind "["                "debug-hud"           // Дубль по имени клавиши [
bind "scancode48"       "debug-console"       // ] (Ъ): диагностика сети и пингов в консоль
bind "]"                "debug-console"       // Дубль по имени клавиши ]
bind "F8"               "debug-hud"           // F8: дубль переключателя мониторинга
bind "F9"               "debug-console"       // F9: дубль сетевой диагностики
bind "F5"               "clutch_mode_toggle"  // F5: режим Clutch (заглушить тиммейтов до конца раунда)
bind "scancode53"       "toggleconsole"       // ~: открыть/закрыть консоль
bind "scancode41"       "cancelselect"        // ESC: меню / отмена
bind "scancode39"       "teammenu"            // 0: меню выбора команды
bind "scancode23"       "+spray_menu"         // T: нанесение граффити
bind "scancode17"       "toggleNoclip"        // N: полёт noclip (для тренировок)

// ─── 8 · ТЕКСТОВЫЙ ЧАТ И РАДИО ────────────────────────────────────────────────
bind "scancode40"       "messagemode"         // Enter: общий текстовый чат (All)
bind "scancode49"       "messagemode2"        // \: командный текстовый чат (Team)
bind "scancode226"      "+voicerecord"        // Left Alt: кнопка рации (Push-to-Talk)

// ─── 9 · БЫСТРАЯ ПОДСТРОЙКА ПРИЦЕЛА СТРЕЛКАМИ (SCANCODES + ИМЕНА) ─────────────
bind "scancode82"       "incrementvar cl_crosshairsize 0 10 0.5"       // Вверх: увеличить размер прицела
bind "scancode81"       "incrementvar cl_crosshairsize 0 10 -0.5"      // Вниз: уменьшить размер прицела
bind "scancode80"       "incrementvar cl_crosshairthickness 0 5 -0.5"  // Влево: сделать линии тоньше
bind "scancode79"       "incrementvar cl_crosshairthickness 0 5 0.5"   // Вправо: сделать линии толще
bind "UPARROW"          "incrementvar cl_crosshairsize 0 10 0.5"
bind "DOWNARROW"        "incrementvar cl_crosshairsize 0 10 -0.5"
bind "LEFTARROW"        "incrementvar cl_crosshairthickness 0 5 -0.5"
bind "RIGHTARROW"       "incrementvar cl_crosshairthickness 0 5 0.5"

// ─── 10 · ЦИКЛ ПОЗИТИВНЫХ ФРАЗ ДЛЯ ТРАСТ-ФАКТОРА ──────────────────────────────
bind "F10"              "tt"                  // F10: отправить следующую позитивную фразу в чат
