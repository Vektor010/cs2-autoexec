// ══════════════════════════════════════════════════════════════════════════════
//  ALIASES.CFG · БЫСТРЫЕ КОМАНДЫ И ШОРТКАТЫ CS2 (PINPAL RU)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · БЫСТРЫЙ СВИТЧ (QUICKSWITCH) ─────────────────────────────────────────
// Удерживая клавишу достаётся нож, отпустив — возврат к предыдущему оружию
alias "+knife"       "slot3"
alias "-knife"       "lastinv"

alias "+quickswitch" "slot3"
alias "-quickswitch" "lastinv"

// Быстрый сброс бомбы без доставания в руки (QoL)
alias "+bomb-drop"   "slot3; slot5"
alias "-bomb-drop"   "drop"

// ─── 2 · JUMPTHROW ────────────────────────────────────────────────────────────
// Классический алиас броска в прыжке (для тренировок и кастомных серверов)
// Примечание: на официальных серверах Valve используется одновременное нажатие Пробел + K/C
alias "+jumpthrow"   "+jump"
alias "-jumpthrow"   "-attack; -jump"

// ─── 3 · СЕРВИСНЫЕ КОМАНДЫ ────────────────────────────────────────────────────
// Полёт noclip со звуковым подтверждением (требует sv_cheats 1)
alias "toggleNoclip" "noclip; play sounds/ui/buttonclickrelease.vsnd_c"

// Меню кастомных ножей (требует sv_cheats 1)
alias "knife"        "exec knifeMenu"

// ─── 4 · ШОРТКАТЫ КОНСОЛИ ─────────────────────────────────────────────────────
alias "ae"      "exec autoexec"                            // Перезагрузить autoexec
alias "q"       "quit"                                      // Выйти из игры
alias "dc"      "disconnect"                               // Отключиться от сервера
alias "rg"      "mp_restartgame 1; toggleconsole"          // Рестарт матча
alias "prac"    "exec gamemodes/practice"                  // Загрузить конфиг тренировки
alias "bhop"    "exec gamemodes/bhop"                      // Загрузить конфиг Bhop
alias "kz"      "exec gamemodes/kz"                        // Загрузить конфиг KZ
alias "lkz"     "exec gamemodes/vanilla_kz"                // Загрузить конфиг Vanilla KZ
alias "vv"      "exec gamemodes/1v1"                       // Загрузить конфиг 1v1
alias "uidemo"  "exec gamemodes/demo_viewer"               // Конфиг просмотра демо
alias "comp"    "exec gamemodes/competitive"               // Конфиг 5v5 матчмейкинга
alias "ctb"     "bot_add_ct"                               // Добавить бота за спецназ (CT)
alias "tb"      "bot_add_t"                                // Добавить бота за террористов (T)
alias "pb"      "bot_place"                                // Разместить бота перед собой
alias "kb"      "bot_kick"                                 // Кикнуть всех ботов
alias "hax"     "sv_cheats 1"                              // Включить читы сервера
alias "fast"    "mp_round_restart_delay 3; mp_freezetime 6" // Ускоренное начало раундов
