// ══════════════════════════════════════════════════════════════════════════════
//  CROSSHAIR.CFG · КРАСНЫЙ СТАТИЧЕСКИЙ КРЕСТ С ТОЧКОЙ (ТОЛЩИНА 2, ДЛИНА 2, ЗАЗОР 0)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ПАРАМЕТРЫ ПРИЦЕЛА (СТРОГО 2 И 2, СТИЛЬ STATIC CROSS) ────────────────
crosshair                       1        // Принудительно включить прицел
cl_crosshairstyle               4        // Style: Static Cross (стиль 4, не 3)
cl_crosshairdot                 1        // Точка в центре: ДА (1)
cl_crosshairsize                2        // Длина: 2 (ровно 2, не 3)
cl_crosshair_length             2        // Новый квар CS2: Длина 2
cl_crosshairthickness           2        // Толщина: 2 (ровно 2, не 3)
cl_crosshair_thickness          2        // Новый квар CS2: Толщина 2
cl_crosshairgap                 0        // Зазор: 0
cl_crosshair_gap                0        // Новый квар CS2: Зазор 0
cl_crosshair_drawoutline        false    // Обводка: NO OUTLINE (0)
cl_crosshair_t                  false    // Т-образный: НЕТ (0)
cl_crosshair_recoil             0        // Прицел зафиксирован (НЕ следует за отдачей)

// ─── 2 · ЦВЕТ И ПРОЗРАЧНОСТЬ ──────────────────────────────────────────────────
cl_crosshaircolor               5        // Пользовательский цвет (RGB)
cl_crosshairusealpha            true     // Учитывать прозрачность
cl_crosshairalpha               255      // Полная непрозрачность (255)
cl_crosshaircolor_r             255      // Красный канал (чистый красный)
cl_crosshaircolor_g             0        // Зеленый канал
cl_crosshaircolor_b             0        // Синий канал

// Снайперские прицелы
cl_crosshair_sniper_width       0        // Тонкие риски в зуме AWP
cl_ironsight_usecrosshaircolor  true     // Точка в прицеле коллиматора совпадает с основным цветом
cl_show_observer_crosshair      2        // Показывать прицелы наблюдаемых игроков (2 = всех игроков)
cl_observed_bot_crosshair       0        // ВСЕГДА показывать СВОЙ прицел при наблюдении за ботами (0 = свой прицел)

// ─── 3 · ПРИЦЕЛЫ ДЛЯ ГРАНАТ (ПОЛНОСТЬЮ ОТКЛЮЧЕНЫ) ─────────────────────────────
cl_grenadecrosshair_keepusercrosshair    false
cl_grenadecrosshair_smoke                false
cl_grenadecrosshair_flash                false
cl_grenadecrosshair_fire                 false
cl_grenadecrosshair_explosive            false
cl_grenadecrosshair_decoy                false

// ─── 4 · БЫСТРЫЕ КОМАНДЫ ПЕРЕКЛЮЧЕНИЯ ПРИЦЕЛА В КОНСОЛИ ──────────────────────
// Напиши в консоли "circle" (круглый), "dot" (квадратный) или "dot_out" (точка с обводкой):
alias "circle"      "cl_crosshairstyle 4; cl_crosshairdot 0; cl_crosshairsize 1; cl_crosshairthickness 1.5; cl_crosshairgap -4; cl_crosshair_drawoutline 0; cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; echo [CS2] Прицел: КРУГЛАЯ ТОЧКА (Overlap)"
alias "dot"         "cl_crosshairstyle 4; cl_crosshairdot 1; cl_crosshairsize 0; cl_crosshairthickness 1.2; cl_crosshairgap -4; cl_crosshair_drawoutline 0; cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; echo [CS2] Прицел: КВАДРАТНАЯ ТОЧКА"
alias "dot_out"     "cl_crosshairstyle 4; cl_crosshairdot 1; cl_crosshairsize 0; cl_crosshairthickness 1.0; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 0; echo [CS2] Прицел: ТОЧКА С ЧЁРНОЙ ОБВОДКОЙ"
