// ══════════════════════════════════════════════════════════════════════════════
//  BUYBINDS.CFG · БЫСТРАЯ ЗАКУПКА И ДРОП ТИММЕЙТАМ CS2
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · АВТОПОКУПКА (AUTOBUY) ────────────────────────────────────────────────
// Срабатывает по команде "autobuy" (по умолчанию F3). Порядок покупки слева направо:
cl_autobuy "vesthelm vest weapon_m4a1_silencer ak47 famas weapon_galilar mac10 mp9 defuser"

// ─── 2 · ГРАНАТЫ (ПОКУПКА И ЭКИПИРОВКА В ОДИН КЛИК) ──────────────────────────
alias "useFlash"  "slot7;  buy flashbang"
alias "useMolly"  "slot10; buy incgrenade; buy molotov"
alias "useSmoke"  "slot8;  buy smokegrenade"
alias "useHE"     "slot6;  buy hegrenade"
alias "useDecoy"  "slot9;  buy decoy"

// ─── 3 · АЛИАСЫ ПОКУПКИ ПО СЛОТАМ LOADOUT ─────────────────────────────────────
alias "buyRifle0"    "buy rifle0"     // Винтовка слот 0
alias "buyRifle1"    "buy rifle1"     // Винтовка слот 1
alias "buyRifle2"    "buy rifle2"     // Винтовка слот 2
alias "buyRifle3"    "buy rifle3"     // Винтовка слот 3
alias "buyRifle4"    "buy rifle4"     // Винтовка слот 4

alias "buyPistol0"   "buy secondary0" // Пистолет слот 0
alias "buyPistol1"   "buy secondary1" // Пистолет слот 1
alias "buyPistol2"   "buy secondary2" // Пистолет слот 2
alias "buyPistol3"   "buy secondary3" // Пистолет слот 3
alias "buyPistol4"   "buy secondary4" // Пистолет слот 4

alias "buyMidTier0"  "buy midtier0"   // SMG/Дробовик слот 0
alias "buyMidTier1"  "buy midtier1"   // SMG/Дробовик слот 1
alias "buyMidTier2"  "buy midtier2"   // SMG/Дробовик слот 2
alias "buyMidTier3"  "buy midtier3"   // SMG/Дробовик слот 3
alias "buyMidTier4"  "buy midtier4"   // SMG/Дробовик слот 4

alias "buyVest"      "buy vest"       // Бронежилет (без шлема)
alias "buyVestHelm"  "buy vesthelm"   // Бронежилет + шлем
alias "buyKit"       "buy defuser"    // Набор сапёра (Kit)

// Возврат покупок текущего раунда (Sellback / Refund)
alias "refundAll"    "sellbackall"

// ─── 4 · БИНДЫ ЗАКУПКИ НА БУКВЕННОЙ КЛАВИАТУРЕ ──────────────────────────────
bind "scancode51"    "buyRifle0"      // ; (Точка с запятой) — Винтовка слот 0
bind "scancode15"    "buyRifle1"      // L — Винтовка слот 1
bind "scancode14"    "buyRifle2"      // K — Винтовка слот 2
bind "scancode12"    "buyRifle3"      // I — Винтовка слот 3
bind "scancode18"    "buyRifle4"      // O — Винтовка слот 4

bind "scancode19"    "buyPistol2"     // P — Пистолет слот 2
bind "scancode54"    "buyPistol3"     // , (Запятая) — Пистолет слот 3
bind "scancode56"    "buyPistol4"     // / (Слэш) — Пистолет слот 4
bind "scancode55"    "buyMidTier4"    // . (Точка) — SMG/Дробовик слот 4

bind "scancode13"    "buyVest"        // J — Бронежилет
bind "scancode24"    "buyVestHelm"    // U — Броня + шлем
bind "scancode42"    "refundAll"      // Backspace (кнопка стереть) — Продать всё купленное в раунде
bind "backspace"     "refundAll"      // Дубликат по имени клавиши
bind "scancode76"    "refundAll"      // Delete — Дубликат по scancode
bind "del"           "refundAll"      // Delete — Дубликат по имени клавиши

// ─── 5 · БИНДЫ ЗАКУПКИ НА ЦИФРОВОМ БЛОКЕ (NUMPAD) ────────────────────────────
alias "buy_ak_m4"    "buy ak47; buy m4a1_silencer; buy m4a1"
alias "buy_awp"      "buy awp"
alias "buy_smg"      "buy mp9; buy mac10"
alias "buy_deagle"   "buy deagle"
alias "buy_flash"    "buy flashbang"
alias "buy_smoke"    "buy smokegrenade"
alias "buy_he"       "buy hegrenade"
alias "buy_molotov"  "buy incgrenade; buy molotov"

bind "kp_1"          "clear"          // Numpad 1: Очистить консоль (clear)
bind "kp_2"          "buy_awp"        // Numpad 2: AWP
bind "kp_3"          "buy_smg"        // Numpad 3: MP9 / Mac-10
bind "kp_4"          "buyVestHelm"    // Numpad 4: Броня + шлем
bind "kp_5"          "buyVest"        // Numpad 5: Бронежилет
bind "kp_6"          "buyKit"         // Numpad 6: Набор сапёра
bind "kp_7"          "buy_flash"      // Numpad 7: Световая (Flash)
bind "kp_8"          "buy_smoke"      // Numpad 8: Дым (Smoke)
bind "kp_9"          "buy_he"         // Numpad 9: Осколочная (HE)
bind "kp_0"          "mute_toggle"    // Numpad 0: Вкл/выкл общий звук игры (Mute/Unmute)
bind "kp_del"        "buy_deagle"     // Numpad . : Desert Eagle
