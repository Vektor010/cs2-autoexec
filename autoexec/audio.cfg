// ══════════════════════════════════════════════════════════════════════════════
//  AUDIO.CFG · НАСТРОЙКИ ЗВУКА CS2 (КВАДРАТИЧНАЯ МОДЕЛЬ + СКРИПТ ГРОМКОСТИ)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ГОЛОСОВАЯ СВЯЗЬ И МИКРОФОН ──────────────────────────────────────────
voice_modenable                 true     // Включить голосовой чат
snd_voipvolume                  0.40     // Громкость тиммейтов в голосовом чате (0.0 - 1.0)
voice_always_sample_mic         1        // Streamlined PTT: непрерывный опрос микрофона (убирает задержку и срезание первого слога)
voice_loopback                  false    // Не воспроизводить свой голос обратно в наушники

// ─── 2 · ОТКЛЮЧЕНИЕ ОТВЛЕКАЮЩИХ ЗВУКОВ И МУЗЫКИ ──────────────────────────────
snd_toolvolume                  0.00     // Громкость служебных звуков консоли ("play")
snd_menumusic_volume            0.00     // Музыка в главном меню
snd_mainmenu_ambience_volume    0.00     // Фоновый эмбиент главного меню
snd_roundaction_volume          0.00     // Музыка действий в раунде
snd_roundstart_volume           0.00     // Музыка в начале раунда
snd_roundend_volume             0.00     // Музыка в конце раунда
snd_deathcamera_volume          0.00     // Музыка после вашей гибели / камера смерти
snd_mvp_volume                  0.00     // Гимн лучшего игрока (MVP) раунда
snd_mapobjective_volume         0.00     // Музыка бомбы/заложников в течение раунда
snd_mute_mvp_music_live_players false    // Отключено: стандартное воспроизведение MVP
cl_player_ping_mute             1        // Заглушить раздражающие звуковые сигналы меток (пинг) на карте

// Отключение раздельной музыки по игровым режимам (вся фоновая музыка на 0)
snd_menumusic_volume_casual     0.00
snd_menumusic_volume_deathmatch 0.00
snd_menumusic_volume_armsrace   0.00
snd_menumusic_volume_rush       0.00
snd_roundstart_volume_casual    0.00
snd_roundstart_volume_deathmatch 0.00
snd_roundstart_volume_armsrace  0.00
snd_roundstart_volume_rush      0.00
snd_roundend_volume_casual      0.00
snd_roundend_volume_deathmatch  0.00
snd_roundend_volume_armsrace    0.00
snd_roundend_volume_rush        0.00
snd_roundaction_volume_casual   0.00
snd_roundaction_volume_deathmatch 0.00
snd_roundaction_volume_armsrace 0.00
snd_roundaction_volume_rush     0.00
snd_mvp_volume_casual           0.00
snd_mvp_volume_deathmatch       0.00
snd_mvp_volume_armsrace         0.00
snd_mvp_volume_rush             0.00
snd_deathcamera_volume_casual   0.00
snd_deathcamera_volume_deathmatch 0.00
snd_deathcamera_volume_armsrace 0.00
snd_deathcamera_volume_rush     0.00
snd_mapobjective_volume_casual  0.00
snd_mapobjective_volume_deathmatch 0.00
snd_mapobjective_volume_armsrace 0.00
snd_mapobjective_volume_rush    0.00
snd_tensecondwarning_volume_casual 0.0144
snd_tensecondwarning_volume_deathmatch 0.0144
snd_tensecondwarning_volume_armsrace 0.0144
snd_tensecondwarning_volume_rush 0.0144

// Единственный важный звуковой тайминг: 10 секунд до взрыва бомбы
snd_tensecondwarning_volume     0.0144   // 12% на ползунке в игре (0.12^2 = 0.0144 по квадратичной шкале звука)

// ─── 3 · ПОЗИЦИОНИРОВАНИЕ И РАСПОЗНАВАНИЕ ШАГОВ ───────────────────────────────
snd_headphone_eq                1        // Пресет EQ: 0=Natural, 1=Crisp (яркие средние/высокие для шагов), 2=Smooth
snd_spatialize_lerp             0.75     // L/R изоляция: 75% (четкое разделение лево/право)
snd_steamaudio_enable_perspective_correction true // Коррекция перспективы источников звука по краям экрана
ui_party_msg_sound_enabled      false    // Отключено: без звука сообщений лобби
snd_mute_losefocus              true     // Тишина при сворачивании игры (Alt+Tab)
snd_mixahead                    0.025    // Буфер задержки аудиомикшера (25 мс — минимальный инпутлаг)

// ─── 4 · МУТ ИГРОКОВ / ПЕРЕКЛЮЧАТЕЛЬ ГОЛОСОВОГО ЧАТА ─────────────────────────
alias "voiceOff" "voice_modenable 0; alias voiceToggle voiceOn; echo [ГОЛОСОВОЙ ЧАТ] ВЫКЛЮЧЕН"
alias "voiceOn"  "voice_modenable 1; alias voiceToggle voiceOff; echo [ГОЛОСОВОЙ ЧАТ] ВКЛЮЧЕН"
alias "voiceToggle" "voiceOff"

alias "vcToggle" "voiceToggle"

// ─── 5 · ЛИЧНЫЙ СКРИПТ ГРОМКОСТИ (ШАГ 5%, КВАДРАТИЧНАЯ ШКАЛА СЛЫШИМОСТИ) ────
// Клавиши: "=" (kp_plus) громче | "-" (kp_minus) тише
alias playBlip "play sounds/ui/menu_accept"

alias vol_00 "volume 0.0000; alias volumeUp vol_05; alias volumeDown vol_00; echo [ЗВУК]   0%  ...................."
alias vol_05 "volume 0.0025; alias volumeUp vol_10; alias volumeDown vol_00; playBlip; echo [ЗВУК]   5%  #..................."
alias vol_10 "volume 0.0100; alias volumeUp vol_15; alias volumeDown vol_05; playBlip; echo [ЗВУК]  10%  ##.................."
alias vol_15 "volume 0.0225; alias volumeUp vol_20; alias volumeDown vol_10; playBlip; echo [ЗВУК]  15%  ###................."
alias vol_20 "volume 0.0400; alias volumeUp vol_25; alias volumeDown vol_15; playBlip; echo [ЗВУК]  20%  ####................"
alias vol_25 "volume 0.0625; alias volumeUp vol_30; alias volumeDown vol_20; playBlip; echo [ЗВУК]  25%  #####..............."
alias vol_30 "volume 0.0900; alias volumeUp vol_35; alias volumeDown vol_25; playBlip; echo [ЗВУК]  30%  ######.............."
alias vol_35 "volume 0.1225; alias volumeUp vol_40; alias volumeDown vol_30; playBlip; echo [ЗВУК]  35%  #######............."
alias vol_40 "volume 0.1600; alias volumeUp vol_45; alias volumeDown vol_35; playBlip; echo [ЗВУК]  40%  ########............"
alias vol_45 "volume 0.2025; alias volumeUp vol_50; alias volumeDown vol_40; playBlip; echo [ЗВУК]  45%  #########........... <- СТАРТ"
alias vol_50 "volume 0.2500; alias volumeUp vol_55; alias volumeDown vol_45; playBlip; echo [ЗВУК]  50%  ##########.........."
alias vol_55 "volume 0.3025; alias volumeUp vol_60; alias volumeDown vol_50; playBlip; echo [ЗВУК]  55%  ###########........."
alias vol_60 "volume 0.3600; alias volumeUp vol_65; alias volumeDown vol_55; playBlip; echo [ЗВУК]  60%  ############........"
alias vol_65 "volume 0.4225; alias volumeUp vol_70; alias volumeDown vol_60; playBlip; echo [ЗВУК]  65%  #############......."
alias vol_70 "volume 0.4900; alias volumeUp vol_75; alias volumeDown vol_65; playBlip; echo [ЗВУК]  70%  ##############......"
alias vol_75 "volume 0.5625; alias volumeUp vol_80; alias volumeDown vol_70; playBlip; echo [ЗВУК]  75%  ###############....."
alias vol_80 "volume 0.6400; alias volumeUp vol_85; alias volumeDown vol_75; playBlip; echo [ЗВУК]  80%  ################...."
alias vol_85 "volume 0.7225; alias volumeUp vol_90; alias volumeDown vol_80; playBlip; echo [ЗВУК]  85%  #################..."
alias vol_90 "volume 0.8100; alias volumeUp vol_95; alias volumeDown vol_85; playBlip; echo [ЗВУК]  90%  ##################.."
alias vol_95 "volume 0.9025; alias volumeUp vol_100; alias volumeDown vol_90; playBlip; echo [ЗВУК]  95%  ###################."
alias vol_100 "volume 1.0000; alias volumeUp vol_100; alias volumeDown vol_95; playBlip; echo [ЗВУК] 100%  ####################"

// Инициализация громкости по умолчанию на комфортные 45% (volume 0.2025)
vol_45

// ─── 6 · ПОЛНОЕ ОТКЛЮЧЕНИЕ ЗВУКА ИГРЫ (MUTE / UNMUTE) ────────────────────────
alias "mute_toggle" "mute_on"
alias "mute_on"     "volume 0.0; echo [ЗВУК ИГРЫ] ПОЛНОСТЬЮ ВЫКЛЮЧЕН (MUTE); alias mute_toggle mute_off"
alias "mute_off"    "volume 0.2025; echo [ЗВУК ИГРЫ] ВКЛЮЧЕН ОБРАТНО; alias mute_toggle mute_on"
