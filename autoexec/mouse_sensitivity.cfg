// ─── 1 · ЧУВСТВИТЕЛЬНОСТЬ ─────────────────────────────────────────────────────
sensitivity                 "1.04"   // Личная чувствительность мыши (eDPI 832 при 800 DPI, ~49.7 см на 360°)
zoom_sensitivity_ratio      "1.00"   // Чувствительность в оптическом прицеле (про-стандарт 1.0)

// ─── 2 · ОСИ И ИНВЕРСИЯ ───────────────────────────────────────────────────────
mouse_inverty               false    // Инверсия по вертикальной оси (false = стандарт)
m_yaw                       0.022    // Горизонтальный множитель мыши (дефолт 0.022)
m_pitch                     0.022    // Вертикальный множитель мыши (дефолт 0.022)
