//  COUNTER-STRIKE 2 · ОПТИМИЗИРОВАННЫЙ AUTOEXEC (PINPAL EDITION RU)
//  Параметры запуска Steam: -novid -nojoy +exec autoexec
// ══════════════════════════════════════════════════════════════════════════════

// Настройка цветов вывода консоли
log_color General    fc9003FF // Оранжевый (Общий)
log_color Console    7999aeFF // Синий     (Ответ команд)
log_color bsp        FF00FFFF // Пурпурный (Карта)
log_color LOADING    FF0000FF // Красный   (Ошибки)
log_color Developer  FF0000FF // Красный   (Сообщения разработчика)
log_color Shooting   00FF00FF // Зелёный   (Субтики стрельбы)

// Сброс текущих привязок клавиш перед загрузкой
unbindall

// Последовательная загрузка модульных конфигов
exec autoexec/aliases
exec autoexec/audio
exec autoexec/buybinds
exec autoexec/crosshair
exec autoexec/game
exec autoexec/hud
exec autoexec/mouse_sensitivity
exec autoexec/network
exec autoexec/trash_talk
exec autoexec/video
exec autoexec/viewmodel
exec autoexec/keybinds

// Фиксация настроек
host_writeconfig

// Вывод итогового сообщения со схемой клавиш
exec autoexec/printMsg
