//  GAME.CFG · НАСТРОЙКИ ГЕЙМПЛЕЯ И ИНТЕРФЕЙСА CS2 (PINPAL RU)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ОБЩИЕ ПАРАМЕТРЫ ──────────────────────────────────────────────────────
con_enable                      true     // Включить консоль разработчика (на ~)
developer                       0        // 0 = отключить служебный спам разработчика в консоль
gameinstructor_enable           false    // Отключить стрелки и подсказки обучающего инструктора
cl_dm_buyrandomweapons          false    // Отключить случайную выдачу оружия в Deathmatch
cl_silencer_mode                0        // 0 = невозможно случайно снять глушитель на M4A1-S и USP-S

// ─── 2 · МЕНЮ ПОКУПКИ ─────────────────────────────────────────────────────────
cl_buywheel_nonumberpurchasing  false    // Разрешить покупку клавишами с цифрами 1-5 в меню покупки
cl_use_opens_buy_menu           true     // Клавиша "E" (+use) открывает меню покупки в зоне закупки
cl_buywheel_donate_key          0        // Клавиша дропа оружия из колеса покупки тиммейту (0: LCtrl, 1: LAlt, 2: LShift)
cl_color                        1        // Зелёный цвет игрока (1 = зелёный)

// ─── 3 · ЛОББИ И ПОИСК ИГРОКОВ ────────────────────────────────────────────────
cl_join_advertise               2        // Друзья могут заходить в лобби без инвайта (2: все серверы, 1: офиц., 0: никто)
ui_setting_advertiseforhire_auto 1       // Показ лобби в поиске тиммейтов "Looking to Play" (1: помнить состояние)

// ─── 4 · НАБЛЮДЕНИЕ И ДЕМО ────────────────────────────────────────────────────
cl_obs_interp_enable            true     // Плавный переход камеры между игроками при наблюдении/демо
cl_obs_interp_pos_rate          0.1      // Скорость перехода камеры
mapoverview_allow_client_draw   true     // Разрешить рисовать на тактической карте при наблюдении
cl_scoreboard_mouse_enable_binding "+attack2" // Курсор мыши в таблице счёта (ПКМ)
demo_mouse_enable_binding       "drop"   // Курсор мыши в меню просмотра демо (G)

// ─── 5 · МУТ И ФИЛЬТРАЦИЯ ИГРОКОВ ─────────────────────────────────────────────
cl_mute_enemy_team              false    // Автоматический мут вражеской команды (false = слышать общий чат врагов)
cl_mute_all_but_friends_and_party 0      // Мут всех кроме друзей (0: выкл, 1: только в нерейтинге, 2: всегда)

// ─── 6 · ПРИВАТНОСТЬ И АВАТАРКИ ───────────────────────────────────────────────
cl_sanitize_player_names        false    // Показывать настоящие ники игроков (false = не заменять на цвета)
cl_hide_avatar_images           0        // Отображение аватарок (0: показывать все, 1: скрыть, 2: только друзья)
cl_allow_animated_avatars       false    // Отключить анимацию анимированных аватарок Steam (повышает FPS)

// ─── 7 · ПОВЕДЕНИЕ КЛАВИШ (УДЕРЖАНИЕ / ПЕРЕКЛЮЧЕНИЕ) ──────────────────────────
option_duck_method              false    // Приседание: false = зажать клавишу, true = переключатель
option_speed_method             false    // Тихий шаг: false = зажать клавишу, true = переключатель

// ─── 8 · ОПТИКА И СНАЙПЕРСКИЕ ВИНТОВКИ ────────────────────────────────────────
cl_debounce_zoom                false    // Зум переключается при удержании клавиши оптики
cl_sniper_auto_rezoom           true     // Автоматический повторный вход в зум после выстрела AWP/Scout
cl_sniper_delay_unscope         false    // Мгновенный выход из зума после выстрела (без задержки)
