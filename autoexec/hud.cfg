// ══════════════════════════════════════════════════════════════════════════════
//  HUD.CFG · ИНТЕРФЕЙС, ТЕЛЕМЕТРИЯ И РАДАР CS2 (PINPAL RU)
// ══════════════════════════════════════════════════════════════════════════════

// ─── 1 · ГРАНИЦЫ И РАЗМЕР ИНТЕРФЕЙСА (SAFEZONE) ──────────────────────────────
alias "setSafeZoneX" "safezonex 1.0"                   // Горизонтальный отступ HUD от краёв монитора (1.0 = к краям)
alias "setSafeZoneY" "safezoney 1.0"                   // Вертикальный отступ HUD от краёв монитора
alias "setHudScale"  "hud_scaling 0.85"                // Общий масштаб элементов интерфейса

setSafeZoneX; setSafeZoneY; setHudScale

// ─── 2 · ВИДИМОСТЬ ЭЛЕМЕНТОВ HUD ─────────────────────────────────────────────
hidehud                         0        // 0 = ничего не скрывать (полный HUD)
cl_draw_only_deathnotices       false    // Отображать полный интерфейс (не только прицел и киллфид)
r_show_build_info               false    // Скрыть технический водяной знак версии сборки игры в нижнем левом углу
r_show_time_info                0        // Отключить вывод отладочного времени кадра (большие цифры) в нижнем левом углу
cl_autohelp                     false    // Отключить всплывающие подсказки для новичков
hud_showtargetid                true     // Отображать имя противника красным при наведении
cl_showloadout                  true     // Всегда отображать иконки имеющегося оружия и гранат в правом нижнем углу
cl_weapon_selection_rarity_color 1       // Подсветка иконок оружия цветом редкости скина (QoL)

// ─── 3 · СЧЁТЧИК ЖИВЫХ ИГРОКОВ ВВЕРХУ ЭКРАНА ──────────────────────────────────
cl_teamcounter_playercount_instead_of_avatars true // Цифры живых игроков вместо больших аватарок команд

cl_hud_color                    0        // Цвет интерфейса зависит от команды (0 = стандартный командный)
cl_color                        1        // Предпочитаемый цвет игрока (1 = зелёный)

// ─── 5 · МЕТКИ И ПИНГИ ────────────────────────────────────────────────────────
cl_ping_fade_deadzone           60       // Дистанция от прицела, на которой метка полностью исчезает
cl_ping_fade_distance           300      // Дистанция от прицела, на которой метка начинает угасать

// ─── 6 · ОВЕРЛЕЙ STEAM ────────────────────────────────────────────────────────
ui_steam_overlay_notification_position       bottomright // Уведомления Steam в правом нижнем углу
ui_steam_overlay_notification_position_horz  0
ui_steam_overlay_notification_position_vert  0

// ─── 7 · ТЕЛЕМЕТРИЯ (МОНИТОРИНГ CS2: АРХИТЕКТУРА ALWJ0) ──────────────────────
cl_showfps                                   0     // Отключить старый текст FPS в верхнем левом углу
cl_hud_telemetry_frametime_show              1     // Время кадра/FPS: 0 = никогда, 1 = при просадках FPS, 2 = всегда
cl_hud_telemetry_frametime_poor              20.0  // Порог времени кадра в мс (20 мс = 50 FPS, сигнал при просадке)

cl_hud_telemetry_ping_show                   1     // Пинг: 0 = никогда, 1 = при скачке пинга, 2 = всегда
cl_hud_telemetry_ping_poor                   66    // Порог плохого пинга в мс (пинг > 66 сигналит)

cl_hud_telemetry_net_misdelivery_show        1     // Потеря пакетов: 0 = никогда, 1 = при потере, 2 = всегда
cl_hud_telemetry_net_misdelivery_poor        2     // Порог потери пакетов в %

cl_hud_telemetry_net_detailed                0     // Детальная статистика сети
cl_hud_telemetry_net_quality_graph_show      0     // График джиттера и потерь пакетов
cl_hud_telemetry_serverrecvmargin_graph_show 0     // График запаса приёма сервером

// ─── 8 · НАСТРОЙКИ РАДАРА (СЕТАП ПОЛЬЗОВАТЕЛЯ) ────────────────────────────────
cl_drawhud_force_radar          0        // Показ радара: 0 = стандарт
cl_radar_always_centered        false    // Радар НЕ центрируется строго на игроке (видно карту целиком)
cl_radar_rotate                 true     // Радар вращается по направлению взгляда
cl_radar_square_with_scoreboard false    // Радар ВСЕГДА круглый (НЕ становится квадратным при нажатии TAB)
cl_hud_radar_map_additive       true     // Аддитивное наложение карты на фон
cl_radar_scale_dynamic          false    // Выключить динамическое авто-зумирование радара
cl_radar_icon_scale_min         0.40     // Минимальный размер иконок игроков на радаре
cl_radar_scale                  0.40     // Приближение карты (0.40 позволяет охватить всю карту)
cl_radar_scale_alternate        1.0      // Альтернативный масштаб при переключении
cl_hud_radar_scale              1.19     // Физический размер круга радара на экране (увеличенный)
cl_hud_radar_background_alpha   1.00     // Прозрачность подложки радара (1.0 = чёткий контрастный фон)
cl_teammate_colors_show         1        // Цвета тиммейтов на радаре

// ─── 9 · SCOREBOARD НА TAB ───────────────────────────────────────────────────
// При зажатом TAB: открывается счёт, интерфейс аккуратно расширяется
alias +scorenet "+showscores; hud_scaling 0.90; safezonex 1.0; safezoney 1.0"
alias -scorenet "-showscores; setHudScale; setSafeZoneX; setSafeZoneY"

// ─── 10 · ТУМБЛЕР МОНИТОРИНГА И ГРАФИКОВ НА КЛАВИШУ [ ИЛИ F8 ────────────────────
// Включает полную телеметрию справа: FPS, Пинг, Loss, детальная сеть и цветные графики качества!
// При этом большие цифры снизу слева (r_show_time_info) и водяной знак остаются ВЫКЛЮЧЕННЫМИ.
alias "debug-hud" "debug-hud_on"
alias "debug-hud_on" "cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_net_detailed 2; cl_hud_telemetry_net_quality_graph_show 2; cl_hud_telemetry_serverrecvmargin_graph_show 2; r_show_time_info 0; r_show_build_info false; cl_ticktiming print; cl_net_printsummary; status; echo [CS2] Мониторинг и графики ВКЛ (диагностика выведена в консоль); alias debug-hud debug-hud_off"
alias "debug-hud_off" "cl_hud_telemetry_frametime_show 1; cl_hud_telemetry_ping_show 1; cl_hud_telemetry_net_misdelivery_show 1; cl_hud_telemetry_net_detailed 0; cl_hud_telemetry_net_quality_graph_show 0; cl_hud_telemetry_serverrecvmargin_graph_show 0; r_show_time_info 0; r_show_build_info false; echo [CS2] Телеметрия и графики: АДАПТИВНЫЙ РЕЖИМ; alias debug-hud debug-hud_on"

// ─── 11 · ДИАГНОСТИКА СЕТИ В КОНСОЛЬ НА КЛАВИШУ ] ИЛИ F9 ──────────────────────
alias "debug-console" "cl_ticktiming print; cl_net_printsummary; status; echo [CS2] Сетевая диагностика выведена в консоль"

